name: Detect & Un-Mirror Flipped UGC Videos

on:
  workflow_dispatch:

jobs:
  unmirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 16, 18]
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg, tesseract-ocr, and opencv
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr python3-opencv python3-numpy
      - name: Run unmirror shard ${{ matrix.shard }} / 20
        env:
          R2_BRIDGE_SECRET: ${{ secrets.R2_BRIDGE_SECRET }}
          SHARD_IDX: ${{ matrix.shard }}
          SHARD_TOTAL: "20"
          MAX_WORKERS: "2"
          OMP_THREAD_LIMIT: "1"
        run: python3 -u fix_mirrored_ugc.py
